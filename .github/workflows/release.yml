name: Release version

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      tag_name: ${{ steps.release_info.outputs.tag_name }}
      release_name: ${{ steps.release_info.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release name and tag
        id: release_info
        run: |
          echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

  release-macos:
    name: ${{ matrix.job.target }} (macOS)
    runs-on: macos-latest  # ✅ GitHub-hosted runner - NO AWS/self-hosted needed
    needs: prepare
    strategy:
      matrix:
        job:
          - os: macos-latest
            platform: darwin
            target: x86_64-apple-darwin
            arch: amd64
            svm_target_platform: macosx-amd64
          - os: macos-latest
            platform: darwin
            target: aarch64-apple-darwin
            arch: arm64
            svm_target_platform: macosx-aarch64

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # Critical for ityfuzz dependencies

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: "nightly-2024-01-01"
          targets: ${{ matrix.job.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: "v2-macos"
          key: ${{ matrix.job.target }}

      - name: Install macOS dependencies (Z3, OpenSSL)
        run: |
          brew install z3 openssl pkg-config cmake

      - name: Build binaries
        env:
          SVM_TARGET_PLATFORM: ${{ matrix.job.svm_target_platform }}
          OPENSSL_DIR: /usr/local/opt/openssl
        run: |
          cargo build --release \
            --bins \
            --target ${{ matrix.job.target }} \
            --features "cmp dataflow evm print_txn_corpus full_trace force_cache real_balance" \
            --no-default-features \
            --locked

      - name: Archive binaries
        id: artifacts
        env:
          TARGET: ${{ matrix.job.target }}
          ARCH: ${{ matrix.job.arch }}
          VERSION_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          chmod +x "./target/${TARGET}/release/ityfuzz"
          gtar -czvf "ityfuzz_${VERSION_NAME}_darwin_${ARCH}.tar.gz" -C ./target/${TARGET}/release ityfuzz
          echo "file_name=ityfuzz_${VERSION_NAME}_darwin_${ARCH}.tar.gz" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare.outputs.release_name }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          files: |
            ${{ steps.artifacts.outputs.file_name }}
