name: Release version

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  # ✅ Fix CMake policy error for z3-sys
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      tag_name: ${{ steps.release_info.outputs.tag_name }}
      release_name: ${{ steps.release_info.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release name and tag
        id: release_info
        run: |
          echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

  release-macos-arm64:
    name: ityfuzz (macOS ARM64)
    runs-on: macos-latest  # GitHub-hosted, no AWS/self-hosted needed
    needs: prepare

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # Critical for ityfuzz

      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: "nightly-2024-01-01"
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: "v2-macos-arm64"
          key: aarch64-apple-darwin

      # ✅ Install dependencies + use system Z3 to avoid z3-sys build issues
      - name: Install macOS dependencies
        run: |
          brew update
          brew install cmake z3 openssl pkg-config
          cmake --version
          z3 --version

      - name: Build ARM64 binary
        env:
          SVM_TARGET_PLATFORM: macosx-aarch64
          OPENSSL_DIR: /usr/local/opt/openssl
          Z3_SYS_USE_PKG_CONFIG: "1"
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          cargo build --release \
            --bins \
            --target aarch64-apple-darwin \
            --features "cmp dataflow evm print_txn_corpus full_trace force_cache real_balance" \
            --no-default-features \
            --locked

      - name: Verify binary architecture
        run: |
          file target/aarch64-apple-darwin/release/ityfuzz
          # Should output: Mach-O 64-bit executable arm64

      - name: Archive binary
        id: artifacts
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          chmod +x "./target/aarch64-apple-darwin/release/ityfuzz"
          gtar -czvf "ityfuzz_${VERSION_NAME}_macos_arm64.tar.gz" -C ./target/aarch64-apple-darwin/release ityfuzz
          echo "file_name=ityfuzz_${VERSION_NAME}_macos_arm64.tar.gz" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare.outputs.release_name }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          files: |
            ${{ steps.artifacts.outputs.file_name }}
