name: Release version
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_BUILD_JOBS: "2"
  Z3_SYS_USE_PKG_CONFIG: "1"
  Z3_STATIC: "0"
jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      tag_name: ${{ steps.release_info.outputs.tag_name }}
      release_name: ${{ steps.release_info.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4          # ✅ fix: v5 doesn't exist
        with:
          fetch-depth: 0
      - name: Compute release name and tag
        id: release_info
        run: |
          echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
  release-macos-arm64:
    name: ityfuzz (macOS ARM64)
    runs-on: macos-latest
    needs: prepare
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4          # ✅ fix: v5 doesn't exist
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "nightly-2024-01-01"
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2       # ✅ fix: v3 doesn't exist
        with:
          cache-on-failure: true
          prefix-key: "v2-macos-arm64"
          key: aarch64-apple-darwin
      - name: Install macOS dependencies
        run: |
          brew update
          brew install cmake z3 openssl pkg-config
          z3 --version
          pkg-config --modversion z3
          # ✅ Print actual paths so you can verify Z3_LIB_DIR/Z3_INCLUDE_DIRS match
          echo "Z3 lib dir: $(brew --prefix z3)/lib"
          echo "Z3 include dir: $(brew --prefix z3)/include"
          ls $(brew --prefix z3)/lib/libz3*
      - name: Build ARM64 binary
        env:
          SVM_TARGET_PLATFORM: macosx-aarch64
          OPENSSL_DIR: /opt/homebrew/opt/openssl
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CARGO_BUILD_JOBS: "2"
          # ✅ z3-sys 0.8.1 respects these instead of Z3_SYS_USE_PKG_CONFIG
          Z3_LIB_DIR: /opt/homebrew/lib
          Z3_INCLUDE_DIRS: /opt/homebrew/include
          Z3_STATIC: "0"
        run: |
          pkg-config --libs z3
          pkg-config --cflags z3

          cargo build --release \
            --verbose \
            --bins \
            --target aarch64-apple-darwin \
            --features "cmp dataflow evm print_txn_corpus full_trace force_cache real_balance" \
            --no-default-features \
            --locked \
            --jobs 2
      - name: Verify binary architecture
        run: |
          file target/aarch64-apple-darwin/release/ityfuzz
      - name: Archive binary
        id: artifacts
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          chmod +x "./target/aarch64-apple-darwin/release/ityfuzz"
          gtar -czvf "ityfuzz_${VERSION_NAME}_macos_arm64.tar.gz" -C ./target/aarch64-apple-darwin/release ityfuzz
          echo "file_name=ityfuzz_${VERSION_NAME}_macos_arm64.tar.gz" >> $GITHUB_OUTPUT
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare.outputs.release_name }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          files: |
            ${{ steps.artifacts.outputs.file_name }}
