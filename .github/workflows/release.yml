name: Release version
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_BUILD_JOBS: "2"
jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      tag_name: ${{ steps.release_info.outputs.tag_name }}
      release_name: ${{ steps.release_info.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute release name and tag
        id: release_info
        run: |
          echo "tag_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "release_name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

  release-macos-arm64:
    name: ityfuzz (macOS ARM64)
    runs-on: macos-latest
    needs: prepare
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "nightly-2024-01-01"
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          prefix-key: "v2-macos-arm64"
          key: aarch64-apple-darwin

      - name: Install macOS dependencies
        run: |
          brew update
          brew install cmake z3 openssl pkg-config
          z3 --version
          echo "Z3 prefix: $(brew --prefix z3)"
          ls "$(brew --prefix z3)/include/z3.h"
          ls "$(brew --prefix z3)/lib/libz3.dylib"

      - name: Build ARM64 binary
        env:
          SVM_TARGET_PLATFORM: macosx-aarch64
          # OpenSSL
          OPENSSL_DIR: /opt/homebrew/opt/openssl
          # pkg-config
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig
          # Tell z3-sys where z3.h lives (fixes "z3.h file not found")
          Z3_SYS_Z3_HEADER: /opt/homebrew/include/z3.h
          # Tell the linker where libz3.dylib lives
          RUSTFLAGS: "-L /opt/homebrew/lib"
          # Tell bindgen where system headers are
          BINDGEN_EXTRA_CLANG_ARGS: "-I/opt/homebrew/include"
        run: |
          # Verify z3 is visible before building
          echo "Z3 header: $Z3_SYS_Z3_HEADER"
          test -f "$Z3_SYS_Z3_HEADER" || (echo "ERROR: z3.h not found at $Z3_SYS_Z3_HEADER" && exit 1)

          cargo build --release \
            --verbose \
            --bins \
            --target aarch64-apple-darwin \
            --features "cmp dataflow evm print_txn_corpus full_trace force_cache real_balance" \
            --no-default-features \
            --locked \
            --jobs 2

      - name: Verify binary architecture
        run: |
          file target/aarch64-apple-darwin/release/ityfuzz

      - name: Archive binary
        id: artifacts
        env:
          VERSION_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          Z3_LIB="$(brew --prefix z3)/lib/libz3.dylib"

          # Re-sign the dylib for distribution
          codesign --force --sign - "$Z3_LIB" || true

          chmod +x "./target/aarch64-apple-darwin/release/ityfuzz"

          # Bundle libz3.dylib alongside the binary so users don't need to install z3
          cp "$Z3_LIB" ./target/aarch64-apple-darwin/release/

          gtar -czvf "ityfuzz_${VERSION_NAME}_macos_arm64.tar.gz" \
            -C ./target/aarch64-apple-darwin/release \
            ityfuzz libz3.dylib

          echo "file_name=ityfuzz_${VERSION_NAME}_macos_arm64.tar.gz" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.prepare.outputs.release_name }}
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          files: |
            ${{ steps.artifacts.outputs.file_name }}
